name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare trimmed site bundle
        run: |
          mkdir _site
          git archive --format=tar HEAD | tar -x -C _site
          rm -rf _site/member_pages/ludka/thesis
          rm -f _site/qnano/hawrylak-qnano-march2017.pdf
          rm -f _site/qnano/qnano-show-part2.pdf
          echo "Site bundle size: $(du -sh _site | cut -f1)"
          echo "File count: $(find _site -type f | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
